services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech_local
      POSTGRES_DB: fintech
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - fintech_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  fintech_data:
